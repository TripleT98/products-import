<mat-card appearance="outlined" class="login-card"
    >
    <mat-card-header class="login-card__header">
        <mat-card-title role="heading" aria-level="1">Вход</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
            <mat-form-field
                ><mat-label>Имя пользователя</mat-label
                ><input
                    matInput
                    formControlName="username"
                    autocomplete="username"
                    required
                    [readOnly]="busy()"
            /></mat-form-field>
            <mat-form-field
                ><mat-label>Пароль</mat-label
                ><input
                    matInput
                    formControlName="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    [readOnly]="busy()"
            /></mat-form-field>
            @if (error()) {
                <p role="alert">{{ error() }}</p>
            }
            <button mat-flat-button type="submit" [disabled]="busy() || form.invalid">
                {{ busy() ? 'Входим…' : 'Войти' }}
            </button>
        </form>
    </mat-card-content></mat-card
>

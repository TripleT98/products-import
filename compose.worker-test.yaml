name: product-import-worker-check

x-environment: &test-environment
  APP_ENV: test
  DB_HOST: db-test
  DB_PORT: '5432'
  POSTGRES_DB: product_import_test
  POSTGRES_USER: product_import_test
  POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use .env.test.example}
  RABBITMQ_HOST: rabbitmq-test
  RABBITMQ_PORT: '5672'
  RABBITMQ_DEFAULT_USER: worker_test
  RABBITMQ_DEFAULT_PASS: ${TEST_POSTGRES_PASSWORD:?Use .env.test.example}
  RABBITMQ_DEFAULT_VHOST: /
  UPLOAD_DIR: /var/app/uploads
  IMAGE_DIR: /var/app/images
  IMPORT_QUEUE_PREFIX: worker_check
  IMPORT_RETRY_DELAY_MS: '100'
  IMPORT_LEASE_SECONDS: '60'

services:
  db-test:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: product_import_test
      POSTGRES_USER: product_import_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use .env.test.example}
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U product_import_test -d product_import_test']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [tests]

  rabbitmq-test:
    image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    environment:
      RABBITMQ_DEFAULT_USER: worker_test
      RABBITMQ_DEFAULT_PASS: ${TEST_POSTGRES_PASSWORD:?Use .env.test.example}
      RABBITMQ_DEFAULT_VHOST: /
    tmpfs: [/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 2s
      timeout: 10s
      retries: 45
    networks: [tests]

  fixtures:
    image: product-import-backend-tests:t04
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: testing
    environment: *test-environment
    volumes: [worker-uploads:/var/app/uploads, worker-images:/var/app/images]
    command: [php, tests/Support/worker-fixture.php, serve]
    depends_on:
      db-test: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, '$$s=@fsockopen("127.0.0.1",18080,$$e,$$m,1);if($$s){fclose($$s);exit(0);}exit(1);']
      interval: 1s
      timeout: 3s
      retries: 45
    networks: [tests]

  worker:
    image: product-import-worker-check:t15
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    environment: *test-environment
    network_mode: service:fixtures
    volumes: [worker-uploads:/var/app/uploads, worker-images:/var/app/images]
    command: [php, bin/worker.php, '--test-image-origin=http://fixture.test:18080']
    depends_on:
      fixtures: {condition: service_healthy}
      rabbitmq-test: {condition: service_healthy}
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s

volumes:
  worker-uploads:
  worker-images:
networks:
  tests:
    internal: true

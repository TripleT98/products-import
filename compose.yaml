services:
  app:
    image: ${COMPOSE_PROJECT_NAME:-product-import}-backend:t03
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    environment: &app-environment
      APP_ENV: ${APP_ENV:-production}
      APP_DIAGNOSTICS_ENABLED: ${APP_DIAGNOSTICS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-product-import}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-product-import-web}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      XLSX_MAX_FILE_BYTES: ${XLSX_MAX_FILE_BYTES:-10485760}
      XLSX_MAX_UNCOMPRESSED_BYTES: ${XLSX_MAX_UNCOMPRESSED_BYTES:-104857600}
      XLSX_MAX_ZIP_ENTRIES: ${XLSX_MAX_ZIP_ENTRIES:-1000}
      XLSX_MAX_COMPRESSION_RATIO: ${XLSX_MAX_COMPRESSION_RATIO:-100}
      XLSX_MAX_DATA_ROWS: ${XLSX_MAX_DATA_ROWS:-10000}
      XLSX_MAX_ROW_NUMBER: ${XLSX_MAX_ROW_NUMBER:-100001}
      XLSX_CHUNK_ROWS: ${XLSX_CHUNK_ROWS:-250}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RabbitMQ user in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RabbitMQ password in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/app/uploads}
      IMAGE_DIR: ${IMAGE_DIR:-/var/app/images}
      IMPORT_LEASE_SECONDS: ${IMPORT_LEASE_SECONDS:-60}
      IMPORT_RETRY_DELAY_MS: ${IMPORT_RETRY_DELAY_MS:-1000}
      IMPORT_QUEUE_PREFIX: ${IMPORT_QUEUE_PREFIX:-product_import}
      IMPORT_RATE_LIMIT: ${IMPORT_RATE_LIMIT:-5}
      IMPORT_RATE_WINDOW_SECONDS: ${IMPORT_RATE_WINDOW_SECONDS:-60}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-5242880}
      IMAGE_CONNECT_TIMEOUT_MS: ${IMAGE_CONNECT_TIMEOUT_MS:-3000}
      IMAGE_TOTAL_TIMEOUT_MS: ${IMAGE_TOTAL_TIMEOUT_MS:-10000}
      IMAGE_MAX_REDIRECTS: ${IMAGE_MAX_REDIRECTS:-3}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-12000000}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-10000}
      IMAGE_MAX_HEADER_BYTES: ${IMAGE_MAX_HEADER_BYTES:-16384}
    volumes: &app-volumes
      - uploads:${UPLOAD_DIR:-/var/app/uploads}
      - images:${IMAGE_DIR:-/var/app/images}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'REQUEST_URI=/fpm-ping SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    image: ${COMPOSE_PROJECT_NAME:-product-import}-backend:t03
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    command: [php, bin/worker.php]
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s

  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RabbitMQ user in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RabbitMQ password in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: ${COMPOSE_PROJECT_NAME:-product-import}-frontend:t03
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes:
      - images:/var/app/images:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/_nginx-health']
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  db-data:
  rabbitmq-data:
  uploads:
  images:

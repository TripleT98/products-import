name: product-import-tests

services:
  db-test:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: product_import_test
      POSTGRES_USER: product_import_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use .env.test.example}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U product_import_test -d product_import_test']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [tests]

  backend-tests:
    image: product-import-backend-tests:t04
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: testing
    environment:
      APP_ENV: test
      JWT_SECRET: ${TEST_JWT_SECRET:?Use .env.test.example}
      JWT_ISSUER: product-import
      JWT_AUDIENCE: product-import-web
      JWT_TTL_SECONDS: '3600'
      APP_DIAGNOSTICS_ENABLED: 'false'
      DB_HOST: db-test
      DB_PORT: '5432'
      POSTGRES_DB: product_import_test
      POSTGRES_USER: product_import_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use .env.test.example}
    depends_on:
      db-test:
        condition: service_healthy
    command: [composer, test]
    networks: [tests]

  frontend-tests:
    image: product-import-frontend-tests:t04
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: tooling
    command: [npm, test]
    networks: [tests]

networks:
  tests:
    internal: true

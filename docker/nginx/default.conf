server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 12m;

    location = /_nginx-health {
        access_log off;
        return 200 'ok';
    }

    location = /api { return 404; }
    # Public static API documentation; protected API operations still require JWT.
    location = /docs { return 301 /docs/; }
    location ^~ /docs/ {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }

    location ^~ /images/.staging/ { return 404; }
    location ^~ /uploads/ { return 404; }
    location ^~ /images/ {
        alias /var/app/images/;
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }

    location ~ /\. { deny all; }
    location ~* \.(php|phtml|phar)$ { return 404; }
    location ~* \.(js|css|ico|png|jpg|jpeg|webp|gif|svg|woff2?)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"UPLOAD_TOO_LARGE","message":"Upload limit exceeded.","details":[]}}';
    }
}
